name: Build portable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, for example 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/MasterDocumentation.Editor/web/package-lock.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterDocumentation-v${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/MasterDocumentation-v${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/MasterDocumentation-v${{ steps.version.outputs.value }}-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.value }}'
          $zip = "artifacts/MasterDocumentation-v$version-win-x64.zip"
          $sha = "$zip.sha256"
          gh release create $tag $zip $sha --title "MasterDocumentation v$version" --generate-notes --verify-tag
