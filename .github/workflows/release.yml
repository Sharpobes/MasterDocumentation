name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, for example 1.1.0'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/MasterDocumentation.Editor/web/package-lock.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $arguments = @('-Version', '${{ steps.version.outputs.value }}')
          # Секреты подписи необязательны: без них выходит неподписанная сборка, как раньше.
          if ($env:SIGNING_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
            $arguments += @('-CertificatePath', $pfx, '-CertificatePassword', $env:SIGNING_PASSWORD)
          }
          .\scripts\build-release.ps1 @arguments

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterDocumentation-v${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/MasterDocumentation-v${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/MasterDocumentation-v${{ steps.version.outputs.value }}-win-x64.zip.sha256
            artifacts/MasterDocumentation-Setup-v${{ steps.version.outputs.value }}.exe
            artifacts/MasterDocumentation-Setup-v${{ steps.version.outputs.value }}.exe.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.value }}'
          $zip = "artifacts/MasterDocumentation-v$version-win-x64.zip"
          $setup = "artifacts/MasterDocumentation-Setup-v$version.exe"
          # Версия с суффиксом (1.2.0-beta) публикуется как предварительный выпуск: страница
          # загрузки та же, но GitHub помечает её Pre-release и не выдаёт как «latest».
          $prerelease = $version -match '[-+]'
          $title = if ($prerelease) { "MasterDocumentation v$version (бета)" } else { "MasterDocumentation v$version" }
          $warning = if ($prerelease) { @"

          > **Предварительная версия.** Возможны ошибки и незаконченные функции. Для повседневной работы берите последний стабильный выпуск.
          "@ } else { '' }
          $notes = @"
          ## Как установить
          $warning
          | Файл | Кому |
          |---|---|
          | ``MasterDocumentation-Setup-v$version.exe`` | Установщик с графическим интерфейсом: выбор папки, ярлыки, запуск сразу после установки, удаление через «Программы и компоненты». Права администратора не нужны. |
          | ``MasterDocumentation-v$version-win-x64.zip`` | Портативная версия: распакуйте архив целиком и запустите ``MasterDocumentation.exe``. |

          Установщик умеет и то и другое: на первом шаге выбирается «Установить на компьютер» или «Портативная версия».

          Установленная копия обновляется сама: приложение проверяет новые выпуски и запускает установщик обновления — скачивать файл вручную больше не нужно.

          Файлы ``.sha256`` — контрольные суммы. Приложение работает полностью локально: .NET и WebView2 доустанавливать не нужно.
          "@
          $arguments = @($tag, $zip, "$zip.sha256", $setup, "$setup.sha256", '--title', $title, '--notes', $notes, '--verify-tag')
          if ($prerelease) { $arguments += '--prerelease' } else { $arguments += '--latest' }
          gh release create @arguments
